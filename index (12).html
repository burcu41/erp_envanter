<body>

  
    <header>
        <h1>ERP Envanter & Stok Yönetim Sistemi</h1>
        <nav>
            <ul>
                <li><a href="#envanter-listesi">Envanter Listesi</a></li>
                <li><a href="#yeni-urun">Yeni Ürün Ekle</a></li>
                <li><a href="#stok-guncelle">Stok Güncelle</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
     
        <section id="envanter-listesi">
            <h2>Mevcut Envanter Listesi</h2>
            
            <table border="1" cellpadding="8" cellspacing="0" width="100%">
                <thead>
                    <tr>
                        <th>Ürün ID</th>
                        <th>Ürün Adı</th>
                        <th>Kategori</th>
                        <th>Durum</th>
                        <th>Kritik Stok Seviyesi</th>
                        <th>Birim Fiyat</th>
                        <th>Toplam Değer</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody>
        
            </table>
        </section>

        <br><hr><br>

    >
        <section id="yeni-urun">
            <h2>Yeni Ürün Tanımlama</h2>
            <form id="yeniUrunFormu">
                <p>
                    <label for="urunAdi"><strong>Ürün Adı:</strong></label><br>
                    <input type="text" id="urunAdi" name="urunAdi" placeholder="Örn: Barkod Okuyucu" style="width: 300px;" required>
                </p>

                <p>
                    <label for="kategoriId"><strong>Kategori:</strong></label><br>
                    <select id="kategoriId" name="kategoriId" style="width: 310px;" required>
                        <option value="">Kategori Seçiniz</option>
                        <option value="1">Dokunmatik Ekranlar</option>
                        <option value="2">Yazıcılar</option>
                        <option value="3">Barkod Okuyucular</option>
                        <option value="4">Donanım & Parça</option>
                    </select>
                </p>

                <p>
                    <label for="birimFiyat"><strong>Birim Fiyat (TL):</strong></label><br>
                    <input type="number" id="birimFiyat" name="birimFiyat" step="0.01" min="0" placeholder="Örn: 2500.00" style="width: 300px;" required>
                </p>

                <p>
                    <label for="stokAdedi"><strong>Mevcut Stok Adedi:</strong></label><br>
                    <input type="number" id="stokAdedi" name="stokAdedi" min="0" placeholder="0" style="width: 300px;" required>
                </p>

                <p>
                    <label for="kritikStok"><strong>Kritik Stok Seviyesi:</strong></label><br>
                    <input type="number" id="kritikStok" name="kritikStok" min="1" placeholder="Minimum stok eşiği" style="width: 300px;" required>
                </p>

                <p>
                    <button type="submit" style="background-color: #0d6efd; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Ürünü Kaydet</button>
                </p>
            </form>
        </section>

        <br><hr><br>

        
        <section id="stok-guncelle">
            <h2>Hızlı Stok Miktarı Güncelleme</h2>
            <form action="#" method="POST">
                <p>
                    <label for="guncellenecekUrun"><strong>Ürün Seçiniz:</strong></label><br>
                    <select id="guncellenecekUrun" name="guncellenecekUrun" style="width: 310px;" required>
                        <option value="">Seçim Yapın</option>
                        <option value="101">101 - Endüstriyel Dokunmatik Ekran 15"</option>
                        <option value="102">102 - Barkod Okuyucu El Terminali</option>
                        <option value="103">103 - TSC Barkod Yazıcı</option>
                    </select>
                </p>

                <p>
                    <label for="islemTuru"><strong>İşlem Türü:</strong></label><br>
                    <select id="islemTuru" name="islemTuru" style="width: 310px;" required>
                        <option value="giris">Stok Girişi (+)</option>
                        <option value="cikis">Stok Çıkışı (-)</option>
                        <option value="dogrudan">Doğrudan Miktar Belirle</option>
                    </select>
                </p>

                <p>
                    <label for="islemMiktari"><strong>Miktar:</strong></label><br>
                    <input type="number" id="islemMiktari" name="islemMiktari" min="1" placeholder="Adet girin" style="width: 300px;" required>
                </p>

                <p>
                    <button type="submit">Stoğu Güncelle</button>
                </p>
            </form>
        </section>
    </main>

    <br><hr>

<script>
  // Terminalinde çalışan port adresi (Port: 5134)
  const API_URL = 'http://localhost:5134/api/products';


  async function envanteriGetir() {
    try {
      const yanit = await fetch(API_URL);
      const urunler = await yanit.json();

      const tabloGovdesi = document.querySelector('tbody');
      if (!tabloGovdesi) return;

      tabloGovdesi.innerHTML = '';

      urunler.forEach(urun => {
        const satir = document.createElement('tr');

       
        const durumRozeti = urun.stokDurumu === 'Kritik Stok Uyarısı'
          ? `<span style="color: #dc3545; font-weight: bold; background: #ffe6e6; padding: 2px 6px; border-radius: 4px;">⚠️ Kritik (${urun.stokAdedi})</span>`
          : `<span style="color: #198754; background: #e8f5e9; padding: 2px 6px; border-radius: 4px;">Yeterli (${urun.stokAdedi})</span>`;

        satir.innerHTML = `
          <td>${urun.urunID}</td>
          <td><strong>${urun.urunAdi}</strong></td>
          <td>${urun.kategoriAdi}</td>
          <td>${durumRozeti}</td>
          <td>${urun.kritikStokSeviyesi}</td>
          <td>${Number(urun.birimFiyat).toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</td>
          <td>${Number(urun.toplamDeger).toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</td>
          <td>
            <button onclick="urunSil(${urun.urunID})" style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Sil</button>
          </td>
        `;
        tabloGovdesi.appendChild(satir);
      });
    } catch (hata) {
      console.error('Listeleme hatası:', hata);
    }
  }

  async function urunSil(id) {
    if (!confirm(`${id} ID'li ürünü envanterden silmek istediğinize emin misiniz?`)) return;

    try {
      const yanit = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      const sonuc = await yanit.json();

      if (sonuc.success) {
        alert('Ürün başarıyla silindi!');
        envanteriGetir(); // Tabloyu anında güncelle
      } else {
        alert('Hata: ' + sonuc.message);
      }
    } catch (hata) {
      console.error('Silme hatası:', hata);
    }
  }

  const form = document.querySelector('#yeniUrunFormu');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

     
      const yeniUrun = {
        urunAdi: document.querySelector('#urunAdi').value,
        kategoriID: parseInt(document.querySelector('#kategoriId').value),
        birimFiyat: parseFloat(document.querySelector('#birimFiyat').value),
        stokAdedi: parseInt(document.querySelector('#stokAdedi').value),
        kritikStokSeviyesi: parseInt(document.querySelector('#kritikStok').value)
      };

      try {
        const yanit = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(yeniUrun)
        });
        const sonuc = await yanit.json();

        if (sonuc.success) {
          alert('Yeni ürün başarıyla eklendi!');
          form.reset();
          envanteriGetir(); 
        } else {
          alert('Hata: ' + sonuc.message);
        }
      } catch (hata) {
        console.error('Ekleme hatası:', hata);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', envanteriGetir);
</script>

</body>
